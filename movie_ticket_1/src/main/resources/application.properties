# Database
spring.datasource.url=jdbc:mysql://localhost:3306/movieticketdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Mysql.01
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# Session
server.servlet.session.timeout=30m

# Logging
logging.level.com.example.movieticket=DEBUG
logging.level.org.springframework.security=WARN